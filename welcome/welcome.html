<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Selamat Datang</title>
    
    <!-- Link CSS Khusus Halaman Welcome -->
    <link rel="stylesheet" href="welcome.css">
    
    <!-- Font Asumsi: Serif elegan dipadu Sans-serif modern -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;1,400&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <!-- Overlay Transisi Keluar (Pindah Halaman) -->
    <div id="transition-overlay" class="page-transition"></div>

    <!-- Background Dekoratif -->
    <div class="bg-canvas" id="bg-canvas">
        <div class="bg-shape shape-1"></div>
        <div class="bg-shape shape-2"></div>
    </div>

    <!-- Konten Utama -->
    <main class="welcome-container">
        
        <!-- Bagian Kiri: Logo & Visual -->
        <div class="visual-section">
            <div class="logo-wrapper reveal-mask" id="logo-trigger" title="Klik logo 5 kali untuk rahasia kecil!">
               
                <img src="../assets/MPS.png" alt="Logo Organisasi" class="logo-img reveal-element delay-1">
            </div>
            
            <!-- Elemen Easter Egg (Tersembunyi) -->
            <div id="easter-egg-msg" class="easter-egg">
                "Kolaborasi Melampaui Batas" 
            </div>
        </div>

        <!-- Bagian Kanan: Teks & Aksi -->
        <div class="content-section">
            <div class="text-content">
                <div class="reveal-mask">
                    <p class="greeting reveal-element delay-2">Selamat Datang di</p>
                </div>
                
                <div class="reveal-mask">
                    <h1 class="org-name reveal-element delay-3">Majelis Perwakilan<br>Siswa</h1>
                </div>
                
                <div class="reveal-mask">
                    <p class="org-desc reveal-element delay-4">
                            Menjaga organisasi, mengembangkan potensi, dan memperjuangkan aspirasi siswa.
                    </p>
                </div>
            </div>

            <div class="action-wrapper reveal-mask">
                <button id="enter-btn" class="magnetic-btn reveal-element delay-5">
                    <span class="btn-text" href="../1.html">About MPS</span>
                    <span class="btn-icon" href="../1.html">→</span>
                </button>
            </div>
        </div>
    </main>

    <!-- Script Khusus Halaman Welcome -->
    <script src="welcome.js"></script>
</body>
</html>
